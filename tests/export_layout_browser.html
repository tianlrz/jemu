<!doctype html><meta charset="utf-8"><title>Jemu export layout</title><h1>Independent layout checks</h1><pre id="result">Running…</pre><script src="/export-layout.js"></script>
<script>
(async()=>{
  const results=[],assert=(ok,label)=>{if(!ok)throw Error(label);results.push('PASS '+label);};
  const app=document.createElement('iframe');app.style.cssText='width:100%;height:550px';document.body.append(app);app.src='/';
  await new Promise(resolve=>app.onload=resolve);
  const frame=app.contentDocument.querySelector('#frame');
  if(!frame.classList.contains('jemu-ready'))await new Promise(resolve=>frame.addEventListener('jemu-ready',resolve,{once:true}));
  const d=frame.contentDocument,pages=[...d.querySelectorAll('[data-jemu-deck]>section')],before=d.documentElement.outerHTML;
  const visible=pages.filter(page=>d.defaultView.getComputedStyle(page).display!=='none');
  assert(pages.length===3&&visible.length===1,'screen lays out only the active page');
  const html=JemuExportLayout.build(d,{pages,width:960,height:540}),exported=new DOMParser().parseFromString(html,'text/html');
  assert(d.documentElement.outerHTML===before,'export snapshot never mutates preview DOM or current page');
  assert(exported.querySelectorAll('[data-jemu-export-page]').length===3,'export document contains all pages');
  assert(!exported.querySelector('[data-deck-active],[data-jemu-page],[data-deckroom-ui],script,base'),'export has no selection, screen-only state, UI or runtime');
  assert(exported.querySelector('style[data-jemu-export-layout]').textContent.includes('break-after:page'),'independent document supplies full print pagination');
  assert(exported.querySelector('[data-jemu-export]').id==='content','source container identity retained for CSS selectors');
  document.querySelector('#result').textContent=results.join('\n');document.documentElement.dataset.result='pass';
})().catch(error=>{document.querySelector('#result').textContent='FAIL '+error.stack;document.documentElement.dataset.result='fail';});
</script>
