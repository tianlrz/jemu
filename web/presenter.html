<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jemu · 简幕 · 演讲者窗口</title><link rel="stylesheet" href="/presenter.css"></head>
<body><header><div><h1 id="deckTitle">演讲者窗口</h1></div><span id="connection" role="status">正在连接展示窗口…</span></header>
<main><section class="overview"><div class="page-block"><span class="label">正在展示</span><div class="page"><strong id="currentPage">—</strong><span>/ <span id="totalPages">—</span></span></div><h2 id="slideTitle">等待稿件</h2><div class="next-label">下一页 <span id="nextTitle">—</span></div></div>
<div class="clock-block"><span class="label">演讲计时</span><div id="timer" aria-label="演讲用时">00:00</div><div class="timer-actions"><button id="timerToggle">开始计时</button><button id="timerReset">计时归零</button></div><label class="target">计划时长 <input id="targetMinutes" type="number" value="8" min="1" max="240"> 分钟</label><div class="progress"><div id="progress"></div></div><span id="timerHint">按实际用时计时，切换窗口后继续。</span></div></section>
<section class="notes-section"><div class="notes-heading"><h2 id="notesHeading">本页讲稿</h2><div><button id="fontSmaller" title="缩小字号">A−</button><button id="fontLarger" title="放大字号">A＋</button><button id="editNotes">编辑讲稿</button></div></div><div id="notes" class="notes">正在载入本页讲稿…</div><div id="notesEditing" hidden><textarea id="notesEditor" aria-label="本页讲稿" rows="9"></textarea><div class="notes-save"><span id="draftPage"></span><button id="cancelNotes">取消</button><button id="saveNotes" class="primary">保存本页讲稿</button></div></div></section>
</main><footer><button id="restart">从头演示 ↺</button><div class="navigation"><button id="previous">← 上一页</button><button id="next" class="primary">下一页 →</button><button id="endPresentation" title="结束演示并恢复主窗口 · Esc">结束演示</button></div><span>← → 翻页 · Esc 结束 · Space 暂停／继续计时</span></footer><div id="message" role="status" hidden></div><script src="/presenter.js"></script></body></html>
