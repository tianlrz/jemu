name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p "*_test.py"
      - run: node tests/compat.test.cjs
      - run: node tests/resources.test.cjs
      - run: node tests/fullscreen.test.cjs
      - name: Windows launchers find a real Python 3.10+
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set JEMU_DRY_RUN=1
          call Start.cmd > start.txt || exit /b 1
          type start.txt
          findstr /i /c:"pythonw.exe" start.txt || exit /b 1
          findstr /i /c:"WindowsApps" start.txt && exit /b 1
          call jemu.cmd --help
